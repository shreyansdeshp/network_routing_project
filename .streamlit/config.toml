[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#070b14"
secondaryBackgroundColor = "#0f1626"
textColor = "#e5e7eb"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
baseRadius = "0.75rem"
borderColor = "#1c2638"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#0a0f1c"
secondaryBackgroundColor = "#111a2c"

[client]
toolbarMode = "minimal"

[server]
headless = true
